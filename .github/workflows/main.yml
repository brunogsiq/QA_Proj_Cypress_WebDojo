name: Cypress E2E Tests

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest

    env:
      USE_LOCAL_SERVER: "false"   # troque para "true" se quiser subir servidor local
      APP_URL: "http://localhost:3000"

    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node (Yarn cache em /web)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'
          cache-dependency-path: web/yarn.lock

      - name: Install deps
        run: yarn install --frozen-lockfile

      # Se precisar gerar dist/, habilite e troque pelo seu comando de build
      # - name: Build app
      #   run: yarn build

      - name: Cypress run (baseUrl externo)
        if: ${{ env.USE_LOCAL_SERVER != 'true' }}
        uses: cypress-io/github-action@v6
        with:
          working-directory: web
          browser: chrome
          config: video=true,trashAssetsBeforeRuns=true

      - name: Cypress run (com servidor local)
        if: ${{ env.USE_LOCAL_SERVER == 'true' }}
        uses: cypress-io/github-action@v6
        with:
          working-directory: web
          start: yarn start:test
          wait-on: ${{ env.APP_URL }}
          browser: chrome
          config: video=true,trashAssetsBeforeRuns=true

      - name: Upload videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-videos
          path: web/cypress/videos
          if-no-files-found: ignore

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: web/cypress/screenshots
          if-no-files-found: ignore
