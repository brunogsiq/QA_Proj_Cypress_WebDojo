name: Cypress E2E Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  e2e-tests:
    timeout-minutes: 1260
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node (LTS) + cache npm
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Instalar dependências (CI)
        run: npm ci

      - name: Rodar Cypress (E2E no Chrome)
        uses: cypress-io/github-action@v6
        with:
          spec: cypress/e2e/**/*.cy.{js,ts}
          browser: chrome

      - name: Artefatos - vídeos (se houver)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-videos
          path: cypress/videos
          if-no-files-found: ignore
          retention-days: 30

      - name: Artefatos - screenshots (apenas falhas)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: cypress/screenshots
          if-no-files-found: ignore
          retention-days: 30